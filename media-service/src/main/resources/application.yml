spring:
  application:
    name: media-service
  datasource:
    url: jdbc:postgresql://localhost:5432/media_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: media-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 3000

server:
  port: 8085
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: media-service
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.socialmedia: DEBUG

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-env-this-is-not-a-real-secret}
  media:
    s3:
      endpoint: http://localhost:9000
      region: us-east-1
      bucket: ${MEDIA_S3_BUCKET:media}
      access-key: ${AWS_ACCESS_KEY_ID:minioadmin}
      secret-key: ${AWS_SECRET_ACCESS_KEY:minioadmin}
      path-style-access: true
      presign-expiry-minutes: 15
    cdn:
      base-url: ${MEDIA_CDN_BASE_URL:}
    thumbnail:
      width: 320
      height: 320
      quality: 0.75
    video-compression:
      enabled: true
      timeout-seconds: 120
    virus-scan:
      host: ${CLAMAV_HOST:localhost}
      port: ${CLAMAV_PORT:3310}
      timeout-ms: 5000
      fail-closed: false
