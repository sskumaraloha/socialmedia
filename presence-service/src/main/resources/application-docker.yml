spring:
  application:
    name: presence-service
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: presence-service
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.socialmedia.*"
    producer:
      acks: all
      properties:
        enable.idempotence: true

server:
  port: 8087
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: presence-service
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.socialmedia: DEBUG
