spring:
  application:
    name: message-service
  data:
    mongodb:
      uri: mongodb://${MONGO_USERNAME:root}:${MONGO_PASSWORD:example}@mongodb:27017/message_db?authSource=admin
      uuid-representation: standard
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: message-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 3000

server:
  port: 8084
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: message-service
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.socialmedia: DEBUG

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-env-this-is-not-a-real-secret}
    message-encryption-key: ${MESSAGE_ENCRYPTION_KEY:/ZAKVd1mipwEpcZlvCpErLEwVDGGJdO52hSZtgebeiU=}

services:
  chat-service:
    base-url: ${CHAT_SERVICE_BASE_URL:http://chat-service:8083}
