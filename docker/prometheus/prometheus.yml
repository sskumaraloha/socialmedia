global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: spring-boot-services
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["gateway-service:8080"]
        labels: { service: gateway-service }
      - targets: ["auth-service:8081"]
        labels: { service: auth-service }
      - targets: ["user-service:8082"]
        labels: { service: user-service }
      - targets: ["chat-service:8083"]
        labels: { service: chat-service }
      - targets: ["message-service:8084"]
        labels: { service: message-service }
      - targets: ["media-service:8085"]
        labels: { service: media-service }
      - targets: ["notification-service:8086"]
        labels: { service: notification-service }
      - targets: ["presence-service:8087"]
        labels: { service: presence-service }
      - targets: ["search-service:8088"]
        labels: { service: search-service }
      - targets: ["ai-service:8089"]
        labels: { service: ai-service }
      - targets: ["payment-service:8090"]
        labels: { service: payment-service }
      - targets: ["analytics-service:8091"]
        labels: { service: analytics-service }
