# Activate with SPRING_PROFILES_ACTIVE=keycloak,docker (or keycloak,local) to delegate
# authentication entirely to an external Keycloak realm - see KeycloakSecurityConfig.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/socialmedia}
