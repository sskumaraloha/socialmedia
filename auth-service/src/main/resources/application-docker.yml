spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://postgres:5432/auth_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH2_CLIENT_ID:changeme-google-client-id}
            client-secret: ${GOOGLE_OAUTH2_CLIENT_SECRET:changeme-google-client-secret}
            scope: openid,profile,email
          github:
            client-id: ${GITHUB_OAUTH2_CLIENT_ID:changeme-github-client-id}
            client-secret: ${GITHUB_OAUTH2_CLIENT_SECRET:changeme-github-client-secret}
            scope: read:user,user:email
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: auth-service
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.socialmedia.*"
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000

server:
  port: 8081
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: auth-service
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.socialmedia: DEBUG

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-env-this-is-not-a-real-secret}
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 2592000
    oauth2:
      authorized-redirect-uri: ${OAUTH2_AUTHORIZED_REDIRECT_URI:http://localhost:3000/oauth2/callback}
